[project]
name = "Livt.Math"
version = "1.6.0"
path = "src"
outdir = "out"

[tests]
path = "tests"
components = [
    "WideArithmeticTest",
    "WideArithmeticPipelineTest",
    "IntegerDivisionTest",
    "IntegerMathTest",
    "UnsignedMathTest",
    "SqrtLUTTest",
    "SqrtNewtonRaphsonTest",
    "MacUnitTest",
    "MacInt32Test",
    "UnsignedDivideInt32Test",
    "Q7Test",
    "Q15Test",
    "UQ8Test",
    "ComplexQ15Test",
    "TrigQ15Test",
    "CordicSinCosQ15Test",
    "CordicAtan2MagnitudeQ15Test",
    "Lcg16Test",
    "Xorshift24Test",
    "SqrtInt32Test",
    "ReciprocalSqrtQ15Test",
    "ReciprocalUQ15Test",
    "TanhQ15Test",
    "SpecialFunctionsTest",
    "StreamingMomentsInt16Test",
    "StreamingArithmeticPipelineTest"
]

[dependencies]
Livt.Base = "1.2.0"

[build.debug]
warnings = ["all"]

[build.release]
warnings = ["all"]

[project]
name = "Livt.Math"
version = "0.2.1"
path = "src"
outdir = "out"

[tests]
path = "tests"
components = [
    "SqrtLUTTest",
    "SqrtNewtonRaphsonTest",
    "MacUnitTest",
    "Lcg16Test",
    "Xorshift24Test"
]

[dependencies]

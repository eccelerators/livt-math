[project]
name = "Livt.Math"
version = "1.7.2"
description = "Reusable integer and fixed-point arithmetic, complex numbers, trigonometry, and statistics for FPGA applications written in Livt."
authors = ["Denis Vasilík"]
repository = "https://github.com/eccelerators/livt-math"
homepage = "https://github.com/eccelerators/livt-math"
keywords = ["fpga", "math", "arithmetic", "fixed-point", "complex", "trigonometry", "statistics"]
license = "MIT"
path = "src"
outdir = "out"

[project.organization]
name = "Eccelerators GmbH"
website = "https://eccelerators.com"

[tests]
path = "tests"
components = [
    "CheckedBlockMac32Test",
    "WideArithmeticTest",
    "WideArithmeticPipelineTest",
    "IntegerDivisionTest",
    "IntegerMathTest",
    "UnsignedMathTest",
    "SqrtLUTTest",
    "SqrtNewtonRaphsonTest",
    "MacUnitTest",
    "MacInt32Test",
    "UnsignedDivideInt32Test",
    "Q7Test",
    "Q15Test",
    "UQ8Test",
    "ComplexQ15Test",
    "TrigQ15Test",
    "CordicSinCosQ15Test",
    "CordicAtan2MagnitudeQ15Test",
    "Lcg16Test",
    "Xorshift24Test",
    "SqrtInt32Test",
    "ReciprocalSqrtQ15Test",
    "ReciprocalUQ15Test",
    "TanhQ15Test",
    "SpecialFunctionsTest",
    "StreamingMomentsInt16Test",
    "StreamingArithmeticPipelineTest"
]

[publish]
files = ["README.md", "CHANGELOG.md", "docs/usage.md", "LICENSE"]

[dependencies]
Livt.Base = "1.2.1"

[build.debug]
warnings = ["all"]

[build.release]
warnings = ["all"]
